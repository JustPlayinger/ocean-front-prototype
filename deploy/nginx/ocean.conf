# 海洋锋面 · Nginx 站点（Ubuntu 24.04 LTS / nginx 1.24+；22.04 亦可，但后端要求 python>=3.11）
#
# 安装：把本文件放到 /etc/nginx/sites-available/ocean，
#       ln -sf /etc/nginx/sites-available/ocean /etc/nginx/sites-enabled/ocean，
#       nginx -t && systemctl reload nginx
# 注意：@SERVER_IP@ 由 remote-setup.sh 用 sed 替换成实例真实公网 IP。
#
# 关键决策（踩过的坑，改前先读）：
# ① 不用 default_server：部分镜像自带 listen 80 default_server 的 server 块，
#    再声明一次会 "duplicate default server" 直接启动失败。
# ② 也不用 server_name _：通配空白名永远匹配不上，请求会落到系统默认站点。
# ③ 用真实 IP 当 server_name：nginx 里「精确 server_name」优先级高于默认站点，
#    因此 http://<IP>/ 能正确落到本站点，且无需改动系统自带配置。
# ④ 免注册别名（2026-09-23 加）：sslip.io / nip.io 是公共通配 DNS，
#    `任意前缀.<IP 用 - 或 . 连接>.sslip.io` 会解析到该 IP，于是可以给 IP 起个好记的名字，
#    无需注册、无需备案（但**依赖第三方 DNS**，国内可能不稳；正式对外仍要域名 + ICP 备案 + 审图号）。
#    下面把「常用别名 + 同族通配」都列上：精确名优先，正则兜住其余同族子域。
#
# 两条链路：
#   /      → 前端静态原型（离线可用，数据文件都在 frontend/prototype/data 下）
#   /api/  → 127.0.0.1:8000 的 FastAPI：服务器端渲染 PNG（raster）与 GeoJSON、点查询、历史统计

server {
    listen 80;
    listen [::]:80;
    # 主入口：IP；另加免注册别名（sslip.io / nip.io 会把这些名字解析到本机 IP）
    server_name @SERVER_IP@
                haifeng.@SS_IP@.sslip.io
                ocean-front.@SS_IP@.sslip.io
                ~^.+\.@SS_IP@\.sslip\.io$
                ~^.+\.@SERVER_IP@\.nip\.io$;

    root /opt/ocean/frontend/prototype;
    index prototype-fishing.html;

    charset utf-8;
    access_log /var/log/nginx/ocean.access.log;
    error_log  /var/log/nginx/ocean.error.log warn;

    # 首屏大约 3.4 MB（62 天离线兜底数据按需注入），压缩后收益明显
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/html text/css application/javascript application/json
               image/svg+xml application/geo+json;

    # 后端：服务器端渲染的图片与矢量都从这里出
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # 首次按需渲染 raster 会有秒级耗时，给足读超时
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # 同一张 PNG 反复取时让浏览器复用
        add_header Cache-Control "public, max-age=300";
    }

    # 静态资源（html / js / PNG / GeoJSON）
    location ~* \.(html|js|css|png|svg|json|geojson)$ {
        try_files $uri =404;
        expires 10m;
        add_header Cache-Control "public, max-age=600";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
