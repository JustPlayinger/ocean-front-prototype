# 海洋锋面 · nginx **测试**站点（只监听回环，公网访问不到）
#
# 用途：把「前端页面 + 8001 测试后端」连起来在浏览器里试，而不碰生产站点（ocean.conf → 8000）。
# 与生产站点的差别：
#   ① 监听 127.0.0.1:8081（**不是** 0.0.0.0）→ 只能通过 SSH 隧道访问，公网打不到，符合「API 不暴露公网」的纪律
#   ② proxy_pass 指向 8001（测试实例），生产站点仍指 8000
#   ③ 不开 sslip.io 别名（那套别名对外本来就被按备案拦截）
#
# 安装（服务器上，root）：
#   sed 's/@SERVER_IP@/116.62.54.140/g' /opt/ocean/deploy/nginx/ocean-test.conf \
#     > /etc/nginx/sites-available/ocean-test
#   ln -sf /etc/nginx/sites-available/ocean-test /etc/nginx/sites-enabled/ocean-test
#   nginx -t && systemctl reload nginx
#
# 访问（你自己电脑上开隧道，然后浏览器打开 http://127.0.0.1:8081/）：
#   ssh -N -L 8081:127.0.0.1:8081 ocean
#
# 撤掉：
#   rm /etc/nginx/sites-enabled/ocean-test && nginx -t && systemctl reload nginx
#
# 配套：先用 tools/ops/start-test-instance.sh start 把 8001 起来，否则这里会 502。

server {
    listen 127.0.0.1:8081;
    server_name _;

    root /opt/ocean/frontend/prototype;
    index prototype-fishing.html;

    charset utf-8;
    access_log /var/log/nginx/ocean-test.access.log;
    error_log  /var/log/nginx/ocean-test.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # 不列 text/html：nginx 对 text/html 永远压缩，显式写会报 duplicate MIME type 警告
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/geo+json;

    # 测试后端（8001）；生产站点仍走 8000
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # 测试时别被浏览器缓存骗了：明确不缓存
        add_header Cache-Control "no-store";
    }

    location ~* \.(html|js|css|png|svg|json|geojson)$ {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
